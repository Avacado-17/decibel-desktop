name: Build & Release Android APK

on:
  push:
    branches:
      - main
    tags:
      - 'v*.*.*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release:
    name: Build and Publish Android APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Configure Secrets and Keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          SENTRY_DSN: ${{ secrets.SENTRY_DSN }}
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
          LASTFM_API_KEY: ${{ secrets.LASTFM_API_KEY }}
          LASTFM_SECRET: ${{ secrets.LASTFM_SECRET }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "Decoding release keystore..."
            echo "$KEYSTORE_BASE64" | base64 --decode > simpmusic.jks
          fi

          echo "Configuring secrets.properties..."
          cat <<EOF > secrets.properties
          SENTRY_DSN=${SENTRY_DSN}
          SENTRY_AUTH_TOKEN=${SENTRY_AUTH_TOKEN}
          LASTFM_API_KEY=${LASTFM_API_KEY}
          LASTFM_SECRET=${LASTFM_SECRET}
          KEYSTORE_PATH=./simpmusic.jks
          KEYSTORE_PASSWORD=${KEYSTORE_PASSWORD}
          KEY_ALIAS=${KEY_ALIAS}
          KEY_PASSWORD=${KEY_PASSWORD}
          EOF

          cp secrets.properties local.properties

      - name: Make Gradlew Executable
        run: chmod +x gradlew

      - name: Export Library Definitions
        run: ./gradlew exportLibraryDefinitions --no-daemon

      - name: Compile Release APK
        run: ./gradlew :composeApp:assembleRelease :androidApp:assembleRelease --no-daemon --stacktrace

      - name: Organize Built APKs
        run: |
          mkdir -p release-apks
          find androidApp/build/outputs/apk/release/ -name "*.apk" -exec cp {} release-apks/ \;
          ls -lh release-apks/

      - name: Upload APK Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: simpmusic-release-apks
          path: release-apks/*.apk

      - name: Create GitHub Release and Attach APKs
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: release-apks/*.apk
          generate_release_notes: true
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
